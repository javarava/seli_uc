<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Complete - Seli Market</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh; background: #f5f5f5;
    }
    .container {
      text-align: center; padding: 40px; background: #fff;
      border-radius: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      max-width: 400px; width: 90%;
    }
    .checkmark {
      width: 64px; height: 64px; border-radius: 50%;
      background: #00b894; color: #fff; font-size: 32px;
      display: flex; justify-content: center; align-items: center;
      margin: 0 auto 20px;
    }
    h1 { font-size: 20px; margin-bottom: 12px; color: #1a1a2e; }
    p { font-size: 15px; color: #555; line-height: 1.5; }
    .small { font-size: 13px; color: #999; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="checkmark">&#10003;</div>
    <h1>Payment Submitted</h1>
    <p>
      If your payment was successful, please return to the
      <strong>Seli Market</strong> app tab to complete your order.
    </p>
    <p class="small">This tab will close automatically in a few seconds.</p>
  </div>

  <script>
    // Parse reference from URL query parameters
    var params = new URLSearchParams(window.location.search);
    var reference = params.get('reference') || params.get('trxref');

    // Notify the opener (Flutter tab) — only works if tab was opened without noopener
    if (window.opener) {
      window.opener.postMessage(
        { type: 'PAYSTACK_PAYMENT_COMPLETE', reference: reference },
        '*'
      );
    }

    // Auto-close after 5 seconds
    setTimeout(function() { window.close(); }, 5000);
  </script>
</body>
</html>
